<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
  <p id="status" role="status" aria-live="polite">채팅에 연결하는 중입니다...</p>
  <div id="webchat" style="height: 600px"></div>
  <script src="https://cdn.botframework.com/botframework-webchat/4.18.0/webchat.js"></script>
  <script>
    const BROKER_URL = "https://dl-broker-juwon-4jt3z.azurewebsites.net/api/directlineToken";
    const SEALED = "I-ZWMeAbN2SKl4GfNXXpmZgX9-y05egLHAnnarXlks2WlmugS0VOieowO8MYElkWp6ZwQHPcOQtm7Qh2WzIkS45OYi2dsR8mJgouPCl5V1sOFL3IUIoM8k4Dzr9NJsBrEiJllOY6pchajD5NWsN1b1YFMOVoPnRy9j3LWTCcEmaBfeXW49nbLmzVStoSIMNV7Wiwd4MPqbstn7chITe3PhQSyKZctFAcoXgs6Bn1n1hSn5dyMV2NvKMhPojncenvY9Sh5-FyYsAir8kUXkzL2Ak0zfTajH6Qd8HH8JBrqwCVgpOMbRW-otq-rZVNJOF-SkfnoP2kDP107lWRbyzddlaTWy0gqU-JMwjqXvQrIHEwKqFSa-gB60oNjEjZZi7Q8tjCQkwMGAOlfPHbcJ8Kkl2aaZ82Zl9PGiJOMRTJyXARozrKA0g6lOs5iCCUgjtNh2-kwSo2cuM7QRWwpsgABou1ThsvEXWet3bXTwjaE-k-5ISUB9pW_OQE0eTLBMQ9WEnHMK8vVoX0LZqS7lzuCdM0YxAWOHKDQKc2aCBFoRUpMihqug17wfa03MIZQcj31ICL8RV-AjLse86VR0ULShHgmIVnAloSU9IQagJiAV4V2_h8jrjMabpcxLDVKlQq-pLSPvN10blqFudo";
    const status = document.getElementById("status");

    function showError(message) {
      status.hidden = false;
      status.textContent = message;
    }

    async function connect() {
      if (!window.WebChat ||
          typeof WebChat.createDirectLine !== "function" ||
          typeof WebChat.renderWebChat !== "function") {
        showError("채팅 구성 요소를 불러오지 못했습니다. 네트워크를 확인한 뒤 새로고침해 주세요.");
        return;
      }

      let response;
      try {
        // Keep this a simple CORS request; the broker may not support preflight.
        response = await fetch(BROKER_URL, {
          method: "POST",
          body: JSON.stringify({ sealed: SEALED })
        });
      } catch {
        showError("서버에 연결하지 못했습니다. 네트워크와 배포 주소를 확인해 주세요.");
        return;
      }
      if (!response.ok) {
        showError("서버가 연결 요청을 처리하지 못했습니다 (HTTP " + response.status + ").");
        return;
      }

      let data;
      try {
        data = await response.json();
      } catch {
        showError("서버 응답을 읽을 수 없습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }
      if (!data || typeof data.token !== "string" || !data.token.trim()) {
        showError("서버에서 연결 토큰을 받지 못했습니다. 암호와 배포 주소를 확인해 주세요.");
        return;
      }

      try {
        const directLine = WebChat.createDirectLine({ token: data.token });
        status.hidden = true;
        directLine.postActivity({
          type: "event", name: "startConversation", from: { id: "user" }
        }).subscribe({
          error: () => showError("첫 인사를 요청하지 못했습니다. 채팅창에 메시지를 입력해 주세요.")
        });
        WebChat.renderWebChat({ directLine, locale: "ko-KR" }, document.getElementById("webchat"));
      } catch {
        showError("채팅을 시작하지 못했습니다. 새로고침 후 다시 시도해 주세요.");
      }
    }

    connect();
  </script>
</body>
</html>
